<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <h2>Login</h2>
            <div id="login-error" class="error-msg"></div>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
            <p class="toggle-text">Don't have an account? <span onclick="toggleForms()">Register here</span></p>
        </form>

        <!-- Registration Form -->
        <form id="register-form" class="auth-form">
            <h2>Register</h2>
            <div id="register-error" class="error-msg"></div>
            <input type="text" id="reg-username" placeholder="Username" required>
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Password (min 8 chars, 1 number)" required>
            <button type="submit" class="btn">Register</button>
            <p class="toggle-text">Already have an account? <span onclick="toggleForms()">Login here</span></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
